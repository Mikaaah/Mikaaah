name: Mod version matching
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'release-system/**'
      - '.github/workflows/version-matching.yml'
  push:
    paths:
      - 'release-system/**'
      - '.github/workflows/version-matching.yml'
permissions:
  contents: read
jobs:
  version-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check registry and release behavior
        working-directory: release-system
        run: |
          python tnk_versions.py check
          python -m unittest discover -s tests -v
          python tnk_versions.py list
